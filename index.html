<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Odin Todo List</title><script defer src=main.js></script></head><body><nav class=sidebar><h1>Projects</h1><ul class=project-list></ul><button type=button class="add-project button">New project</button></nav><main class=main><div class=main-container><div class=list-container><h2 class=list__heading><input></h2><button type=button class="delete-project button delete">Delete Project</button></div><ul class=list__todos></ul><input class="add-todo button" placeholder="Add todo"></div><form class="todo__details inactive" aria-hidden=true><div class=todo__details__container><h3><input class=todo__title></h3><input class=todo__description> <input type=date class=todo__due-date> <select class=todo__priority><option value=0>-<option value=1>Low<option value=2>Medium<option value=3>High</select></div><button type=button class="delete-todo button delete">Delete</button></form></main></body></html>
