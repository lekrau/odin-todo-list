<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Todo List</title>
</head>

<body>
    <nav class="sidebar">
        <h1>Projects</h1>
        <ul class="project-list"></ul>
        <button type="button" class="add-project">New project</button>
    </nav>
    <main class="main">
        <div class="main-container">
            <h2 class="list__heading">
                <input type="text">
            </h2>
            <ul class="list__todos"></ul>
            <input type="text" class="add-todo" placeholder="Add todo">
        </div>
        <form class="todo__details inactive" aria-hidden="true">
            <div class="todo__details__container">
                <h3><input type="text" class="todo__title"></h3>
                <input type="text" class="todo__description">
                <input type="date" class="todo__due-date">
                <select class="todo__priority">
                    <option value="0">-</option>
                    <option value="1">Low</option>
                    <option value="2">Medium</option>
                    <option value="3">High</option>
                </select>
            </div>
            <button type="button" class="delete-todo">Delete</button>
        </form>
    </main>
</body>

</html>
