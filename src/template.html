<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Todo List</title>
</head>

<body>
    <nav class="sidebar">
        <h1>Projects</h1>
        <ul class="project-list"></ul>
    </nav>
    <main class="main">
        <div class="main-container">
            <h2 class="list__heading"></h2>
            <ul class="list__todos"></ul>
            <input type="text" class="add-todo">
        </div>
        <form class="todo__details inactive" aria-hidden="true">
            <h3><input type="text" class="todo__title"></h3>
            <input type="text" class="todo__description">
            <input type="text" class="todo__due-date">
            <input type="text" class="todo__priority">
        </form>
    </main>
</body>

</html>
