<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Todo List</title>
</head>

<body>
    <nav class="sidebar">
        <h1>Projects</h1>
        <ul class="project-list"></ul>
    </nav>
    <main class="main">
        <div class="main-container">
            <h2 class="list__heading"></h2>
            <ul class="list__todos"></ul>
        </div>
        <div class="todo__details inactive" aria-hidden="true">
            <h3 class="todo__title"></h3>
            <p class="todo__description"></p>
            <p class="todo__due-date"></p>
            <p class="todo__priority"></p>
        </div>
    </main>
</body>

</html>
